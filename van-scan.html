<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Select Van</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body style="margin:0; padding:0;">

<div id="scanner" style="width:100%; height:100vh;"></div>

<script>
function showLocatingScreen(vanNumber) {
    document.body.innerHTML = `
        <div style="
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            font-size:32px;
            text-align:center;
            font-weight:bold;
        ">
            Locating,<br>Van ${vanNumber}
        </div>
    `;

    setTimeout(() => {
        window.location.href = "index.html";
    }, 2000);
}

function startVanScanner() {
    const scanner = new Html5Qrcode("scanner");

    scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        (decodedText) => {

            // EXAMPLE FORMAT: VAN|209
            const parts = decodedText.split("|");
            const vanNumber = parts[1];

            // Update session
            let session = {};
            try { session = JSON.parse(localStorage.getItem("dfnaSession") || "{}"); } catch(e){}
            session.vanNumber = vanNumber;
            localStorage.setItem("dfnaSession", JSON.stringify(session));

            scanner.stop().then(() => {
                showLocatingScreen(vanNumber);
            });
        },
        (err) => { /* ignore scan errors */ }
    );
}

startVanScanner();
</script>

</body>
</html>
