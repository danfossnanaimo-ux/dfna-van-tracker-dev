<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Select Van</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: system-ui, sans-serif;
        color: white;
    }

    #container {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    #preview {
        width: 320px;
        height: 320px;
        background: #111;
        border-radius: 16px;
        object-fit: cover;
    }

    #caption {
        margin-top: 18px;
        font-size: 22px;
        font-weight: 500;
        text-align: center;
    }
</style>
</head>

<body>

<div id="container">
    <video id="preview" autoplay playsinline></video>
    <p id="caption">Scan Van QR Code</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.umd.min.js"></script>

<script>
    const video = document.getElementById("preview");
    let scanner;

    // Your live Apps Script API
    const LOOKUP_URL = "https://script.google.com/macros/s/AKfycbxW9NwuYgTyUBc2PFFn8dEx8ZemrPRKOnyhuuVmyMtGHtQhpA__J-97p0E_eSHnwJcn/exec";

    async function startScanner() {
        try {
            scanner = new QrScanner(video, result => handleScan(result), {
                preferredCamera: "environment"
            });

            await scanner.start();
        } catch (err) {
            fallbackToDefaultCamera();
        }
    }

    async function fallbackToDefaultCamera() {
        try {
            scanner = new QrScanner(video, result => handleScan(result), {
                preferredCamera: "auto"
            });

            await scanner.start();
        } catch (err) {
            console.error("Camera failed:", err);
        }
    }

    async function handleScan(vin) {
        scanner.stop();

        vin = vin.trim();

        if (!vin) {
            alert("Invalid VIN QR");
            startScanner();
            return;
        }

        // Lookup van number from Google Sheet
        const response = await fetch(`${LOOKUP_URL}?vin=${encodeURIComponent(vin)}`);
        const data = await response.json();

        if (data.error) {
            alert("VIN not found in database");
            startScanner();
            return;
        }

        let vanNumber = data.vanNumber;

        // Extract only digits (DFNA-12 → 12, or 209 → 209)
        const digits = vanNumber.match(/\d+/g);
        const numericVan = digits ? digits[digits.length - 1] : null;

        if (!numericVan) {
            alert("Van number format invalid");
            startScanner();
            return;
        }

        const user = JSON.parse(localStorage.getItem("dfnaUser") || "{}");

        if (!user.name) {
            alert("User not logged in");
            window.location.href = "login.html";
            return;
        }

        const session = {
            user,
            vin,
            vanNumber,
            numericVan
        };

        localStorage.setItem("dfnaSession", JSON.stringify(session));

        window.location.href = "index.html";
    }

    window.onload = startScanner;
</script>

</body>
</html>
