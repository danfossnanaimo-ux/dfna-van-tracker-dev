<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scan Van VIN</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: system-ui, sans-serif;
        color: white;
        overflow: hidden;
    }

    #container {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    #preview {
        width: 320px;
        height: 320px;
        background: #111;
        border-radius: 16px;
        object-fit: cover;
    }

    #caption {
        margin-top: 18px;
        font-size: 22px;
        font-weight: 500;
        text-align: center;
    }

    /* FULLSCREEN ERROR OVERLAY */
    #errorOverlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0,0,0,0.85);
        color: #ff4444;
        font-size: 36px;
        font-weight: bold;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        z-index: 9999;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease-out;
    }

    #errorOverlay.show {
        opacity: 1;
        pointer-events: auto;
    }
</style>
</head>

<body>

<div id="container">
    <video id="preview" autoplay playsinline></video>
    <p id="caption">Scan Van VIN</p>
</div>

<div id="errorOverlay"></div>

<script src="https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.umd.min.js"></script>

<script>
    const LOOKUP_URL = "YOUR_APPS_SCRIPT_URL_HERE"; 
    const video = document.getElementById("preview");
    const errorOverlay = document.getElementById("errorOverlay");
    let scanner;

    function showError(msg) {
        errorOverlay.textContent = msg;
        errorOverlay.classList.add("show");

        setTimeout(() => {
            errorOverlay.classList.remove("show");
            startScanner();
        }, 2000);
    }

    async function startScanner() {
        try {
            scanner = new QrScanner(video, result => handleScan(result.data), {
                preferredCamera: "environment"
            });
            await scanner.start();
        } catch (err) {
            fallbackToDefaultCamera();
        }
    }

    async function fallbackToDefaultCamera() {
        try {
            scanner = new QrScanner(video, result => handleScan(result.data), {
                preferredCamera: "auto"
            });
            await scanner.start();
        } catch (err) {
            console.error("Camera failed:", err);
        }
    }

    async function handleScan(vin) {
        scanner.stop();

        vin = vin.trim();
        console.log("Scanned VIN:", vin);

        try {
            const url = `${LOOKUP_URL}?vin=${encodeURIComponent(vin)}`;
            console.log("Fetching:", url);

            const response = await fetch(url);
            const text = await response.text();
            console.log("Raw response:", text);

            let data;
            try {
                data = JSON.parse(text);
            } catch (err) {
                showError("Invalid Vehicle");
                return;
            }

            if (!data.vanNumber) {
                showError("Invalid Vehicle");
                return;
            }

            const vanNumber = data.vanNumber;
            const user = JSON.parse(localStorage.getItem("dfnaUser") || "{}");

            if (!user.name) {
                showError("Invalid User");
                return;
            }

            const session = {
                user,
                vin,
                vanNumber,
                numericVan: vanNumber
            };

            localStorage.setItem("dfnaSession", JSON.stringify(session));

            window.location.href = "index.html";

        } catch (err) {
            console.error(err);
            showError("Invalid Vehicle");
        }
    }

    window.onload = startScanner;
</script>

</body>
</html>
