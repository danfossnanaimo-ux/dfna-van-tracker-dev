<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Select Van</title>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        #scanner {
            width: 100vw;
            height: 100vh;
        }
        #scanner > * {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body style="margin:0; padding:0;">

<div id="scanner"></div>

<script>
alert("VAN PAGE LOADED");  // <— 1) fires as soon as van-scan.html loads

function showLocatingScreen(vanNumber) {
    alert("SHOW LOCATING FOR VAN " + vanNumber);  // <— 3) confirms we reached the message

    document.body.innerHTML = `
        <div style="
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            font-size:32px;
            text-align:center;
            font-weight:bold;
        ">
            Locating,<br>Van ${vanNumber}
        </div>
    `;

    setTimeout(() => {
        window.location.href = "index.html";
    }, 2000);
}

function startVanScanner() {
    const scanner = new Html5Qrcode("scanner");

    scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        (decodedText) => {

            alert("SCAN CALLBACK FIRED: " + decodedText);  // <— 2) confirms scan success

            const parts = decodedText.split("|");
            const vanNumber = parts[1];

            let session = {};
            try { session = JSON.parse(localStorage.getItem("dfnaSession") || "{}"); } catch(e){}
            session.vanNumber = vanNumber;
            localStorage.setItem("dfnaSession", JSON.stringify(session));

            scanner.stop().then(() => {
                setTimeout(() => {
                    showLocatingScreen(vanNumber);
                }, 200);
            });
        }
    );
}

startVanScanner();
</script>


</body>
</html>
