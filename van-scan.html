<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Select Van</title>
    <script src="https://unpkg.com/html5-qrcode?v=2"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .title {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            z-index: 10;
        }

        #scanner {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #scanner > * {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>

<body>

<div class="title">Scan Van QR Code</div>
<div id="scanner"></div>

<script>
function showLocatingScreen(vanNumber) {
    document.body.innerHTML = `
        <div style="
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            font-size:32px;
            text-align:center;
            font-weight:bold;
            background:#000;
            color:#fff;
        ">
            Locating,<br>Van ${vanNumber}
        </div>
    `;

    setTimeout(() => {
        window.location.href = "index.html";
    }, 2000);
}

function startVanScanner() {
    const scanner = new Html5Qrcode("scanner");

    scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        (decodedText) => {

            const parts = decodedText.split("|");
            const vanNumber = parts[1];

            let session = {};
            try { session = JSON.parse(localStorage.getItem("dfnaSession") || "{}"); } catch(e){}
            session.vanNumber = vanNumber;
            localStorage.setItem("dfnaSession", JSON.stringify(session));

            scanner.stop().then(() => {
                setTimeout(() => {
                    showLocatingScreen(vanNumber);
                }, 200);
            });
        }
    );
}

startVanScanner();
</script>

</body>
</html>
