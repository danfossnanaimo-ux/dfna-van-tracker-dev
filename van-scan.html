<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Select Van</title>
</head>
<body>

<div id="scanner"></div>

<script src="https://unpkg.com/html5-qrcode"></script>

<script>
function showLocatingScreen(vanNumber) {
    document.body.innerHTML = `
        <div style="
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            font-size:32px;
            text-align:center;
            font-weight:bold;
        ">
            Locating,<br>Van ${vanNumber}
        </div>
    `;

    setTimeout(() => {
        window.location.href = "index.html";
    }, 2000);
}

function startVanScanner() {
    const scanner = new Html5Qrcode("scanner");

    scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        (decodedText) => {

            // Example QR format: "VAN|209"
            const parts = decodedText.split("|");
            const vanNumber = parts[1];

            // Update session
            const session = JSON.parse(localStorage.getItem("dfnaSession") || "{}");
            session.vanNumber = vanNumber;
            localStorage.setItem("dfnaSession", JSON.stringify(session));

            scanner.stop();

            // SHOW THE MESSAGE SCREEN
            showLocatingScreen(vanNumber);
        }
    );
}

startVanScanner();
</script>

</body>
</html>
