<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Select Van</title>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        /* RESET EVERYTHING */
        html, body, div, span, applet, object, iframe,
        h1, h2, h3, h4, h5, h6, p, blockquote, pre,
        a, abbr, acronym, address, big, cite, code,
        del, dfn, em, img, ins, kbd, q, s, samp,
        small, strike, strong, sub, sup, tt, var,
        b, u, i, center,
        dl, dt, dd, ol, ul, li,
        fieldset, form, label, legend,
        table, caption, tbody, tfoot, thead, tr, th, td,
        article, aside, canvas, details, embed,
        figure, figcaption, footer, header, hgroup,
        menu, nav, output, ruby, section, summary,
        time, mark, audio, video {
            margin: 0;
            padding: 0;
            border: 0;
            font-size: 100%;
            font: inherit;
            vertical-align: baseline;
        }

        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .title {
            position: fixed;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            z-index: 9999;
        }

        #scanner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw !important;
            height: 100vh !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            background: #000;
            z-index: 1;
        }

        /* FORCE html5-qrcode internals to fill screen */
        #scanner > * {
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
            max-height: none !important;
        }
    </style>
</head>

<body>

<div class="title">Scan Van QR Code</div>
<div id="scanner"></div>

<script>
function showLocatingScreen(vanNumber) {
    document.body.innerHTML = `
        <div style="
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#000;
            color:#fff;
            font-size:32px;
            font-weight:bold;
            text-align:center;
        ">
            Locating,<br>Van ${vanNumber}
        </div>
    `;

    setTimeout(() => {
        window.location.href = "index.html";
    }, 2000);
}

function startVanScanner() {
    const scanner = new Html5Qrcode("scanner");

    scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        (decodedText) => {

            const parts = decodedText.split("|");
            const vanNumber = parts[1];

            let session = {};
            try { session = JSON.parse(localStorage.getItem("dfnaSession") || "{}"); } catch(e){}
            session.vanNumber = vanNumber;
            localStorage.setItem("dfnaSession", JSON.stringify(session));

            scanner.stop().then(() => {
                setTimeout(() => {
                    showLocatingScreen(vanNumber);
                }, 200);
            });
        }
    );
}

startVanScanner();
</script>

</body>
</html>
