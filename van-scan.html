<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scan Van VIN</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: system-ui, sans-serif;
        color: white;
    }

    #container {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    #preview {
        width: 320px;
        height: 320px;
        background: #111;
        border-radius: 16px;
        object-fit: cover;
    }

    #caption {
        margin-top: 18px;
        font-size: 22px;
        font-weight: 500;
        text-align: center;
    }
</style>
</head>

<body>

<div id="container">
    <video id="preview" autoplay playsinline></video>
    <p id="caption">Scan Van VIN</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.umd.min.js"></script>

<script>
    const LOOKUP_URL = "https://script.google.com/macros/s/AKfycbz8j8q7x9p0Q2xZx8Z2o2sdfsdflkjsdf/exec"; 
    // ^ Replace with your actual Apps Script URL

    const video = document.getElementById("preview");
    let scanner;

    async function startScanner() {
        try {
            scanner = new QrScanner(video, result => handleScan(result.data), {
                preferredCamera: "environment"
            });
            await scanner.start();
        } catch (err) {
            fallbackToDefaultCamera();
        }
    }

    async function fallbackToDefaultCamera() {
        try {
            scanner = new QrScanner(video, result => handleScan(result.data), {
                preferredCamera: "auto"
            });
            await scanner.start();
        } catch (err) {
            console.error("Camera failed:", err);
        }
    }

    async function handleScan(vin) {
        scanner.stop();

        vin = vin.trim();
        console.log("Scanned VIN:", vin);

        try {
            const url = `${LOOKUP_URL}?vin=${encodeURIComponent(vin)}`;
            console.log("Fetching:", url);

            const response = await fetch(url);
            const text = await response.text();
            console.log("Raw response:", text);

            let data;
            try {
                data = JSON.parse(text);
            } catch (err) {
                alert("Server returned invalid JSON:\n" + text);
                startScanner();
                return;
            }

            if (!data.vanNumber) {
                alert("VIN not found in database:\n" + vin);
                startScanner();
                return;
            }

            const vanNumber = data.vanNumber;

            const user = JSON.parse(localStorage.getItem("dfnaUser") || "{}");

            const session = {
                user,
                vin,
                vanNumber,
                numericVan: vanNumber
            };

            localStorage.setItem("dfnaSession", JSON.stringify(session));

            window.location.href = "index.html";

        } catch (err) {
            alert("Error: " + err.message);
            console.error(err);
            startScanner();
        }
    }

    window.onload = startScanner;
</script>

</body>
</html>
