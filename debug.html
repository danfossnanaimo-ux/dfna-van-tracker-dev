<!DOCTYPE html>
<html>
<body style="font-family: monospace; padding: 20px;">
<h2>DFNA Debug</h2>

<pre id="out"></pre>

<script>
const user = localStorage.getItem("dfnaUser");
const session = localStorage.getItem("dfnaSession");

document.getElementById("out").textContent =
    "dfnaUser:\n" + user + "\n\n" +
    "dfnaSession:\n" + session;
</script>

</body>
</html>
