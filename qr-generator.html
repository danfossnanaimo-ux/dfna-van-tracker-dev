<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DFNA Avery DOCX QR Generator</title>

<!-- Track whether docx.js loaded -->
<script>
window.docxLoaded = false;
</script>

<!-- THE ONLY CDN THAT EXPOSES window.docx -->
<script src="https://unpkg.com/docx@8.3.2/build/index.umd.js"
        onload="window.docxLoaded = true;"
        onerror="alert('Failed to load docx.js — CDN blocked or unreachable');">
</script>

<!-- QR Code generator -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
  body {
    font-family: system-ui, sans-serif;
    padding: 20px;
  }
  textarea {
    width: 100%;
    height: 160px;
    font-size: 14px;
    padding: 10px;
    box-sizing: border-box;
  }
  button {
    margin-top: 12px;
    padding: 12px;
    width: 100%;
    font-size: 18px;
    background: #1e88e5;
    color: white;
    border: none;
    border-radius: 8px;
  }
</style>
</head>
<body>

<h1>DFNA Avery DOCX QR Generator</h1>
<p>Paste employee lines OR upload CSV. Format per line:</p>
<pre>Full Name / Division / EmployeeID</pre>

<textarea id="inputBox" placeholder="Paste list here..."></textarea>
<input type="file" id="csvFile" accept=".csv">

<button onclick="generateDocx()">Generate DOCX</button>

<script>
document.getElementById("csvFile").addEventListener("change", function() {
  const file = this.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById("inputBox").value = e.target.result;
  };
  reader.readAsText(file);
});

function parseInput(text) {
  return text
    .split(/\r?\n/)
    .map(line => line.trim())
    .filter(line => line.length > 0);
}

async function generateDocx() {

  // Ensure docx.js loaded
  if (!window.docxLoaded || !window.docx) {
    alert("docx.js did not load — check CDN or network");
    return;
  }

  const raw = document.getElementById("inputBox").value.trim();
  if (!raw) {
    alert("Paste employee list or upload CSV.");
    return;
  }

  const lines = parseInput(raw);

  // Pull docx classes from window.docx
  const {
    Document,
    Packer,
    Paragraph,
    Table,
    TableRow,
    TableCell,
    WidthType,
    AlignmentType,
    ImageRun,
    TextRun
  } = window.docx;

  const doc = new Document({
    sections: []
  });

  // Convert cm to twips (1 cm = 567 twips)
  const cm = v => Math.round(v * 567);

  const colWidth = cm(9);     // 9 cm
  const rowHeight = cm(5.2);  // 5.2 cm
  const qrSize = cm(5);       // 50 mm = 5 cm

  for (let i = 0; i < lines.length; i += 10) {
    const chunk = lines.slice(i, i + 10);
    const rows = [];

    for (let r = 0; r < 5; r++) {
      const cells = [];

      for (let c = 0; c < 2; c++) {
        const index = r * 2 + c;
        const fullString = chunk[index];

        if (!fullString) {
          cells.push(new TableCell({
            children: [new Paragraph("")],
            width: { size: colWidth, type: WidthType.DXA }
          }));
          continue;
        }

        // Parse: Full Name / Division / EmployeeID
        const parts = fullString.split("/");
        const name = parts[0].trim();
        const employeeId = parts[2]?.trim() || "";

        // Generate QR
        const qrCanvas = document.createElement("canvas");
        new QRCode(qrCanvas, {
          text: fullString,
          width: 256,
          height: 256
        });

        const dataUrl = qrCanvas.querySelector("img").src;
        const base64 = dataUrl.split(",")[1];
        const qrImage = Uint8Array.from(atob(base64), c => c.charCodeAt(0));

        cells.push(
          new TableCell({
            width: { size: colWidth, type: WidthType.DXA },
            children: [
              new Paragraph({
                alignment: AlignmentType.CENTER,
                children: [
                  new ImageRun({
                    data: qrImage,
                    transformation: { width: qrSize, height: qrSize }
                  })
                ]
              }),
              new Paragraph({
                alignment: AlignmentType.CENTER,
                children: [
                  new TextRun({ text: name, bold: true, size: 28 })
                ]
              }),
              new Paragraph({
                alignment: AlignmentType.CENTER,
                children: [
                  new TextRun({ text: employeeId, size: 22 })
                ]
              })
            ]
          })
        );
      }

      rows.push(new TableRow({
        height: { value: rowHeight },
        children: cells
      }));
    }

    const table = new Table({
      rows,
      width: { size: 100, type: WidthType.PERCENTAGE }
    });

    doc.addSection({
      properties: {
        page: {
          margin: {
            top: cm(1.85),
            bottom: cm(1.45),
            left: cm(1.72),
            right: cm(0.79)
          }
        }
      },
      children: [table]
    });
  }

  const blob = await Packer.toBlob(doc);
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "DFNA_QR_Cards.docx";
  a.click();
}
</script>

</body>
</html>
