<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>DFNA Van Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/dfna-van-tracker-dev/manifest.json">
<meta name="theme-color" content="#000000">

<!-- SINGLE, CORRECT SERVICE WORKER REGISTRATION -->
<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/dfna-van-tracker-dev/service-worker.js");
}
</script>

<style>
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }

    #sessionInfo {
        height: 50px;
        line-height: 50px;
        background: #222;
        color: #fff;
        text-align: center;
        font-size: 16px;
        position: absolute;
        top: 0;
        width: 100%;
        z-index: 9999;
    }

    #map {
        position: absolute;
        top: 50px;   /* below the session bar */
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        height: calc(100% - 50px);
        background: #000;
    }

    /* ============================
       USER MARKER (2× SIZE)
       ============================ */

    .user-pulse {
        position: relative;
        width: 48px;
        height: 48px;
    }

    .inner-dot {
        width: 28px;
        height: 28px;
        background: #00ff55;
        border-radius: 50%;
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 2;
    }

    .pulse-ring {
        position: absolute;
        width: 48px;
        height: 48px;
        border: 6px solid #00ff55;
        border-radius: 50%;
        animation: pulse 1.6s infinite;
        opacity: 0.7;
        z-index: 1;
    }

    @keyframes pulse {
        0% {
            transform: scale(0.6);
            opacity: 0.8;
        }
        70% {
            transform: scale(1.6);
            opacity: 0;
        }
        100% {
            opacity: 0;
        }
    }
</style>

</head>

<body>

    <div id="sessionInfo">Loading session…</div>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Your optimized app logic -->
    <script src="assets/js/app.js?v=12"></script>

    <script>
        // Force Leaflet to recalc size once visible
        setTimeout(() => {
            if (window.map && window.map.invalidateSize) {
                window.map.invalidateSize();
            }
        }, 400);
    </script>

</body>
</html>
