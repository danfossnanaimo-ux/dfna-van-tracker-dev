<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DFNA Van Tracker</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #f0f0f0;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        #loading {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 9999;
        }

        #navButton {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-size: 22px;
            cursor: pointer;
            z-index: 9999;
        }
    </style>
</head>

<body>

<div id="loading">Loading…</div>
<div id="map"></div>

<button id="navButton" onclick="openNavigation()">🧭</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
let map;
let vanMarker = null;
let userMarker = null;
let yardBoundaryLayer = null;

let vanLat = null;
let vanLng = null;
let userLat = null;
let userLng = null;

let vanReady = false;
let userReady = false;

/* ICONS */
function vanIcon(number) {
    return L.divIcon({
        html:
            '<div style="' +
                'width:34px;height:34px;border-radius:50%;' +
                'background:#1976d2;color:white;font-weight:bold;' +
                'display:flex;align-items:center;justify-content:center;' +
                'font-size:14px;border:2px solid white;' +
                'box-shadow:0 0 6px rgba(0,0,0,0.4);' +
            '">' + number + '</div>',
        className: "",
        iconSize: [34, 34]
    });
}

function userIcon() {
    return L.divIcon({
        html:
            '<div style="position:relative;width:34px;height:34px;">' +
                '<div style="' +
                    'position:absolute;top:50%;left:50%;' +
                    'width:20px;height:20px;background:#00e676;' +
                    'border-radius:50%;transform:translate(-50%,-50%);' +
                    'box-shadow:0 0 12px rgba(0,230,118,0.9);' +
                '"></div>' +
            '</div>',
        className: "",
        iconSize: [34, 34]
    });
}

/* YARD BOUNDARY */
const yardBoundaryCoords = [
    [49.04099970424841, -123.86796072616107],
    [49.04104856987419, -123.8678059019293],
    [49.041067364333145, -123.865328714224],
    [49.04103729319556, -123.86520256114628],
    [49.04099594535228, -123.86513948460765],
    [49.04029302675602, -123.86516242153071],
    [49.04014266854696, -123.86700310961727],
    [49.04099970424841, -123.86796072616107]
];

/* INIT MAP */
window.addEventListener("load", () => {
    requestAnimationFrame(() => {
        requestAnimationFrame(initMap);
    });
});

function initMap() {
    const vanVIN = localStorage.getItem("dfnaVIN");

    map = L.map("map", { zoomControl: true, minZoom: 12, maxZoom: 20 });

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 20
    }).addTo(map);

    yardBoundaryLayer = L.polygon(yardBoundaryCoords, {
        color: "#ff0000",
        weight: 3,
        fillOpacity: 0.15
    }).addTo(map);

    fetchVanLocation(vanVIN);
    getUserLocation();
}

/* FETCH VAN GPS */
function fetchVanLocation(vin) {
    fetch("/dfna-van-tracker-dev/data/locations.json")
        .then(res => res.json())
        .then(locations => {

            const van = locations.find(v => v.vin === vin);

            if (!van) {
                alert("Van not found");
                window.location.href = "scan-van.html";
                return;
            }

            vanLat = van.gps.latitude;
            vanLng = van.gps.longitude;

            const number = (van.name || "").split(" ")[0] || "??";

            if (!vanMarker) {
                vanMarker = L.marker([vanLat, vanLng], { icon: vanIcon(number) }).addTo(map);
            } else {
                vanMarker.setLatLng([vanLat, vanLng]);
            }

            vanReady = true;
            tryFit();
        });
}

/* GET USER GPS */
function getUserLocation() {
    if (!navigator.geolocation) {
        userReady = false;
        tryFit();
        return;
    }

    navigator.geolocation.getCurrentPosition(
        pos => {
            userLat = pos.coords.latitude;
            userLng = pos.coords.longitude;

            if (!userMarker) {
                userMarker = L.marker([userLat, userLng], { icon: userIcon() }).addTo(map);
            } else {
                userMarker.setLatLng([userLat, userLng]);
            }

            userReady = true;
            tryFit();
        },
        err => {
            console.log("User GPS failed:", err);
            userReady = false;
            tryFit();
        }
    );
}

/* FIT LOGIC */
function tryFit() {
    if (!vanReady) return;

    if (userReady) {
        const group = L.featureGroup([vanMarker, userMarker]);
        map.fitBounds(group.getBounds(), { padding: [50, 50] });
    } else {
        map.setView([vanLat, vanLng], 18);
    }

    hideLoading();
}

/* NAVIGATION BUTTON */
function openNavigation() {
    if (!userMarker || !vanMarker) return;

    const u = userMarker.getLatLng();
    const v = vanMarker.getLatLng();

    const url =
        "https://www.google.com/maps/dir/?api=1" +
        "&origin=" + u.lat + "," + u.lng +
        "&destination=" + v.lat + "," + v.lng;

    window.open(url, "_blank");
}
</script>

</body>
</html>
