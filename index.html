<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DFNA Van Tracker</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        #map { width: 100%; height: 100%; }
        #infoBar {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 16px;
            z-index: 1000;
        }
    </style>
</head>

<body>

    <div id="infoBar">Loading…</div>
    <div id="map"></div>

    <div id="debug" style="
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        max-height: 40%;
        overflow-y: auto;
        background: rgba(0,0,0,0.85);
        color: #0f0;
        font-size: 14px;
        padding: 8px;
        z-index: 99999;
        white-space: pre-wrap;
    "></div>

    <script>
    function dbg(msg) {
        const box = document.getElementById("debug");
        box.textContent += msg + "\n";
        console.log(msg);
    }
    dbg("index.html loaded");
    </script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="assets/js/app.js" defer></script>

    <script>
        dbg("index.html: injecting map.js…");
        const s = document.createElement("script");
        s.src = "assets/js/map.js?ts=" + Date.now();
        s.onload = () => dbg("index.html: map.js LOADED successfully");
        s.onerror = () => dbg("index.html: map.js FAILED to load");
        document.body.appendChild(s);
    </script>

</body>
</html>
