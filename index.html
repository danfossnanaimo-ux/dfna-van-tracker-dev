<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DFNA Van Tracker</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #f0f0f0;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        #loading {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 9999;
        }

        /* Navigation button */
        #navButton {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-size: 22px;
            cursor: pointer;
            z-index: 9999;
        }
    </style>
</head>

<body>

<div id="loading">Loading…</div>
<div id="map"></div>

<!-- Navigation button -->
<button id="navButton" onclick="openNavigation()">🧭</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
var allVanMarkers = [];
var map;
var vanMarker;
var userMarker;
var yardBoundaryLayer;

/* ---------------------------------------------------------
   ICONS
--------------------------------------------------------- */
function vanIcon(number) {
    return L.divIcon({
        html:
            '<div style="' +
                'width:34px;height:34px;border-radius:50%;' +
                'background:#1976d2;color:white;font-weight:bold;' +
                'display:flex;align-items:center;justify-content:center;' +
                'font-size:14px;border:2px solid white;' +
                'box-shadow:0 0 6px rgba(0,0,0,0.4);' +
            '">' + number + '</div>',
        className: "",
        iconSize: [34, 34]
    });
}

function userIcon() {
    return L.divIcon({
        html:
            '<div style="position:relative;width:34px;height:34px;">' +
                '<div style="' +
                    'position:absolute;top:50%;left:50%;' +
                    'width:20px;height:20px;background:#00e676;' +
                    'border-radius:50%;transform:translate(-50%,-50%);' +
                    'box-shadow:0 0 12px rgba(0,230,118,0.9);' +
                '"></div>' +
            '</div>',
        className: "",
        iconSize: [34, 34]
    });
}

/* ---------------------------------------------------------
   YARD BOUNDARY
--------------------------------------------------------- */
var yardBoundaryCoords = [
    [49.04099970424841, -123.86796072616107],
    [49.04104856987419, -123.8678059019293],
    [49.041067364333145, -123.865328714224],
    [49.04103729319556, -123.86520256114628],
    [49.04099594535228, -123.86513948460765],
    [49.04029302675602, -123.86516242153071],
    [49.04014266854696, -123.86700310961727],
    [49.04099970424841, -123.86796072616107]
];

/* ---------------------------------------------------------
   INIT (DELAYED TO FIX iPHONE MAP SIZE BUG)
--------------------------------------------------------- */
window.addEventListener("load", () => {
    requestAnimationFrame(() => {
        requestAnimationFrame(initMap);
    });
});

function initMap() {
    const user = JSON.parse(localStorage.getItem("dfnaUser") || "{}");
    const van = localStorage.getItem("dfnaVIN");

    map = L.map("map", { zoomControl: true, minZoom: 12, maxZoom: 20 });

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 20
    }).addTo(map);

    yardBoundaryLayer = L.polygon(yardBoundaryCoords, {
        color: "#ff0000",
        weight: 3,
        fillOpacity: 0.15
    }).addTo(map);

    map.fitBounds(yardBoundaryLayer.getBounds());

    fetchAndUpdate(van);
    setInterval(() => fetchAndUpdate(van), 10000);
}

/* ---------------------------------------------------------
   FETCH + UPDATE MARKERS
--------------------------------------------------------- */
function fetchAndUpdate(van) {
    fetch("/dfna-van-tracker-dev/data/locations.json")
        .then(res => res.json())
        .then(locations => {

            allVanMarkers.forEach(m => map.removeLayer(m));
            allVanMarkers = [];

            const selectedVanData = locations.find(v => v.vin === van);
            if (!selectedVanData) return;

            const selLat = selectedVanData.gps.latitude;
            const selLng = selectedVanData.gps.longitude;
            const selNumber = (selectedVanData.name || "").split(" ")[0] || "??";

            if (!vanMarker) {
                vanMarker = L.marker([selLat, selLng], { icon: vanIcon(selNumber) }).addTo(map);
            } else {
                vanMarker.setLatLng([selLat, selLng]);
                vanMarker.setIcon(vanIcon(selNumber));
            }

            locations.forEach(v => {
                if (v.vin === van) return;

                const lat = v.gps.latitude;
                const lng = v.gps.longitude;
                const num = (v.name || "").split(" ")[0] || "??";

                const dist = map.distance([selLat, selLng], [lat, lng]);

                if (dist <= 10) {
                    const icon = L.divIcon({
                        html:
                            '<div style="' +
                                'width:34px;height:34px;border-radius:50%;' +
                                'background:#1976d2;color:white;font-weight:bold;' +
                                'display:flex;align-items:center;justify-content:center;' +
                                'font-size:14px;border:2px solid white;' +
                                'opacity:0.3;' +
                            '">' + num + '</div>',
                        className: "",
                        iconSize: [34, 34]
                    });

                    const m = L.marker([lat, lng], { icon }).addTo(map);
                    allVanMarkers.push(m);
                }
            });

            updateUserAndFit(selLat, selLng);
        });
}

/* ---------------------------------------------------------
   USER + AUTO-FIT (DELAYED TO FIX iPHONE GEO BUG)
--------------------------------------------------------- */
function updateUserAndFit(vanLat, vanLng) {
    if (!navigator.geolocation) {
        map.setView([vanLat, vanLng], 18);
        return;
    }

    navigator.geolocation.getCurrentPosition(
        pos => {
            const uLat = pos.coords.latitude;
            const uLng = pos.coords.longitude;

            if (!userMarker) {
                userMarker = L.marker([uLat, uLng], { icon: userIcon() }).addTo(map);
            } else {
                userMarker.setLatLng([uLat, uLng]);
            }

            if (vanMarker && userMarker) {
                const group = L.featureGroup([vanMarker, userMarker]);

                // ⭐ FIX: Delay fitBounds so both markers exist before fitting
                setTimeout(() => {
                    map.fitBounds(group.getBounds(), { padding: [50, 50] });
                }, 50);
            }
        },
        () => {
            map.setView([vanLat, vanLng], 18);
        }
    );
}

/* ---------------------------------------------------------
   NAVIGATION BUTTON
--------------------------------------------------------- */
function openNavigation() {
    if (!userMarker || !vanMarker) return;

    const u = userMarker.getLatLng();
    const v = vanMarker.getLatLng();

    const url =
        "https://www.google.com/maps/dir/?api=1" +
        "&origin=" + u.lat + "," + u.lng +
        "&destination=" + v.lat + "," + v.lng;

    window.open(url, "_blank");
}
</script>

</body>
</html>
