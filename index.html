<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DFNA Van Tracker</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="manifest" href="manifest.json">

    <style>
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }

    #sessionInfo {
        height: 50px;
        line-height: 50px;
        background: #222;
        color: #fff;
        text-align: center;
        font-size: 16px;
        position: absolute;
        top: 0;
        width: 100%;
        z-index: 9999;
    }

    #map {
        position: absolute;
        top: 50px;   /* below the session bar */
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        height: calc(100% - 50px);
        background: #000;
    }

    /* ============================
       USER MARKER (2× SIZE)
       ============================ */

    .user-pulse {
        position: relative;
        width: 48px;   /* doubled from 24 */
        height: 48px;  /* doubled from 24 */
    }

    .inner-dot {
        width: 28px;   /* doubled from 14 */
        height: 28px;
        background: #00ff55;
        border-radius: 50%;
        position: absolute;
        top: 10px;     /* doubled from 5 */
        left: 10px;
        z-index: 2;
    }

    .pulse-ring {
        position: absolute;
        width: 48px;   /* doubled from 24 */
        height: 48px;
        border: 6px solid #00ff55;  /* doubled from 3 */
        border-radius: 50%;
        animation: pulse 1.6s infinite;
        opacity: 0.7;
        z-index: 1;
    }

    @keyframes pulse {
        0% {
            transform: scale(0.6);
            opacity: 0.8;
        }
        70% {
            transform: scale(1.6);
            opacity: 0;
        }
        100% {
            opacity: 0;
        }
    }
</style>

</head>

<body>

    <div id="sessionInfo">Loading session…</div>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Your app logic -->
    <script src="assets/js/app.js?v=11"></script>

    <script>
        // Force Leaflet to recalc size once iframe becomes visible
        setTimeout(() => {
            if (window.map && window.map.invalidateSize) {
                window.map.invalidateSize();
            }
        }, 400);
    </script>

</body>
</html>
