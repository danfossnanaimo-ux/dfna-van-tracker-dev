<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DFNA Van Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, sans-serif;
    }

    #map {
        width: 100%;
        height: 100%;
    }

    #sessionInfo {
        position: fixed;
        top: 10px;
        left: 10px;
        background: rgba(0,0,0,0.7);
        color: #0f0;
        padding: 8px 12px;
        font-size: 14px;
        border-radius: 6px;
        z-index: 9999;
    }
</style>
</head>

<body>

<div id="sessionInfo">Loading session…</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- IMPORTANT: app.js must load LAST -->
<script src="app.js"></script>

</body>
</html>
