<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DFNA Van Tracker</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #f0f0f0;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Optional loading overlay */
        #loading {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 9999;
        }
    </style>
</head>

<body>

<div id="loading">Loading…</div>
<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- INLINE APP LOGIC (NO app.js, NO map.js) -->
<script>
/* ---------------------------------------------------------
   GLOBALS
--------------------------------------------------------- */
var allVanMarkers = [];
var map;
var vanMarker;
var userMarker;
var yardBoundaryLayer;

/* ---------------------------------------------------------
   UI CLEANUP
--------------------------------------------------------- */
function hideLoading() {
    var loading = document.getElementById("loading");
    if (loading) loading.style.display = "none";
}

/* ---------------------------------------------------------
   CUSTOM MARKERS
--------------------------------------------------------- */
function vanIcon(number) {
    var html =
        '<div style="' +
            'width:34px;height:34px;border-radius:50%;' +
            'background:#1976d2;color:white;font-weight:bold;' +
            'display:flex;align-items:center;justify-content:center;' +
            'font-size:14px;border:2px solid white;' +
            'box-shadow:0 0 6px rgba(0,0,0,0.4);' +
        '">' + number + '</div>';

    return L.divIcon({ html: html, className: "", iconSize: [34, 34] });
}

function userIcon() {
    var html =
        '<div style="position:relative;width:34px;height:34px;">' +
            '<div style="' +
                'position:absolute;top:50%;left:50%;' +
                'width:20px;height:20px;background:#00e676;' +
                'border-radius:50%;transform:translate(-50%,-50%);' +
                'box-shadow:0 0 12px rgba(0,230,118,0.9);' +
            '"></div>' +
        '</div>';

    return L.divIcon({ html: html, className: "", iconSize: [34, 34] });
}

/* ---------------------------------------------------------
   YARD BOUNDARY
--------------------------------------------------------- */
var yardBoundaryCoords = [
    [49.04099970424841, -123.86796072616107],
    [49.04104856987419, -123.8678059019293],
    [49.041067364333145, -123.865328714224],
    [49.04103729319556, -123.86520256114628],
    [49.04099594535228, -123.86513948460765],
    [49.04029302675602, -123.86516242153071],
    [49.04014266854696, -123.86700310961727],
    [49.04099970424841, -123.86796072616107]
];

/* ---------------------------------------------------------
   INIT
--------------------------------------------------------- */
window.addEventListener("load", function () {

    var user = JSON.parse(localStorage.getItem("dfnaUser") || "{}");
    var driver = user.name || "Unknown";
    var van = localStorage.getItem("dfnaVIN");

    map = L.map("map", { 
    zoomControl: true,
    minZoom: 12,
    maxZoom: 20,
    doubleClickZoom: false,
    tap: false
    });

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 20
    }).addTo(map);

    yardBoundaryLayer = L.polygon(yardBoundaryCoords, {
        color: "#ff0000",
        weight: 3,
        fillOpacity: 0.15
    }).addTo(map);

    map.fitBounds(yardBoundaryLayer.getBounds());

    fetchAndUpdate(van);
    setInterval(function () { fetchAndUpdate(van); }, 10000);
});

/* ---------------------------------------------------------
   FETCH + UPDATE MARKERS
--------------------------------------------------------- */
function fetchAndUpdate(van) {
    fetch("/dfna-van-tracker-dev/data/locations.json")
        .then(function (res) { return res.json(); })
        .then(function (locations) {

            // Clear old nearby van markers
            allVanMarkers.forEach(function (m) { map.removeLayer(m); });
            allVanMarkers = [];

            // Find the selected van by VIN
            var selectedVanData = locations.find(function (v) { return v.vin === van; });
            if (!selectedVanData) return;

            var selLat = selectedVanData.gps.latitude;
            var selLng = selectedVanData.gps.longitude;
            var selNumber = (selectedVanData.name || "").split(" ")[0] || "??";

            // Selected van marker (full opacity)
            if (!vanMarker) {
                vanMarker = L.marker([selLat, selLng], { icon: vanIcon(selNumber) }).addTo(map);
            } else {
                vanMarker.setLatLng([selLat, selLng]);
                vanMarker.setIcon(vanIcon(selNumber));
            }
            // Add double-tap navigation to Google Maps
            vanMarker.off("dblclick"); // prevent duplicate bindings
            vanMarker.on("dblclick", function () {
                if (!userMarker) return;
            
                var u = userMarker.getLatLng();
                var v = vanMarker.getLatLng();
            
                var url =
                    "https://www.google.com/maps/dir/?api=1" +
                    "&origin=" + u.lat + "," + u.lng +
                    "&destination=" + v.lat + "," + v.lng;
            
                window.open(url, "_blank");
            });
            
            // Plot other vans within 10m at 30% opacity
            locations.forEach(function (v) {
                if (v.vin === van) return; // skip selected van

                var lat = v.gps.latitude;
                var lng = v.gps.longitude;
                var num = (v.name || "").split(" ")[0] || "??";

                var dist = map.distance([selLat, selLng], [lat, lng]);

                if (dist <= 10) {
                    var iconHtml =
                        '<div style="' +
                            'width:34px;height:34px;border-radius:50%;' +
                            'background:#1976d2;color:white;font-weight:bold;' +
                            'display:flex;align-items:center;justify-content:center;' +
                            'font-size:14px;border:2px solid white;' +
                            'opacity:0.3;' +
                        '">' + num + '</div>';

                    var icon = L.divIcon({ html: iconHtml, className: "", iconSize: [34, 34] });
                    var m = L.marker([lat, lng], { icon: icon }).addTo(map);
                    allVanMarkers.push(m);
                }
            });

            updateUserAndFit(selLat, selLng);
        });
}

/* ---------------------------------------------------------
   USER + AUTO-FIT BOTH MARKERS
--------------------------------------------------------- */
function updateUserAndFit(vanLat, vanLng) {
    if (!navigator.geolocation) {
        map.setView([vanLat, vanLng], 18);
        hideLoading();
        return;
    }

    navigator.geolocation.getCurrentPosition(
        function (pos) {
            var uLat = pos.coords.latitude;
            var uLng = pos.coords.longitude;

            if (!userMarker) {
                userMarker = L.marker([uLat, uLng], { icon: userIcon() }).addTo(map);
            } else {
                userMarker.setLatLng([uLat, uLng]);
            }

            if (vanMarker && userMarker) {
            var group = L.featureGroup([vanMarker, userMarker]);
            var bounds = group.getBounds();
        
            // Fit both markers
            map.fitBounds(bounds, { padding: [50, 50] });
        
            // Force one zoom level closer AFTER fitBounds finishes
            map.once("moveend", function () {
            setTimeout(function () {
                if (map.getBounds().contains(vanMarker.getLatLng()) &&
                    map.getBounds().contains(userMarker.getLatLng())) {
                    map.setZoom(map.getZoom() + 1);
                }
            }, 50); // small delay fixes iPhone rendering lag
            });

        }

            hideLoading();
        },
        function () {
            map.setView([vanLat, vanLng], 18);
            hideLoading();
        }
    );
}
</script>

</body>
</html>
