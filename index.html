<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DFNA Van Tracker</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    />

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #sessionInfo {
            width: 100%;
            padding: 10px;
            background: #222;
            color: #fff;
            font-size: 16px;
            text-align: center;
            z-index: 9999;
        }

        #map {
            width: 100%;
            height: calc(100% - 50px);
        }

        /* USER MARKER — PULSING GREEN DOT */
        .user-pulse {
            position: relative;
            width: 128px;
            height: 128px;
        }

        .user-pulse .inner-dot {
            position: absolute;
            width: 64px;
            height: 64px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: #00ff00;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,255,0,0.8);
        }

        .user-pulse .pulse-ring {
            position: absolute;
            width: 96px;
            height: 96px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: rgba(0,255,0,0.3);
            animation: pulse 2s infinite ease-out;
        }

        @keyframes pulse {
            0% {
                transform: translate(-50%, -50%) scale(0.6);
                opacity: 0.8;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.8);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div id="sessionInfo">Loading session…</div>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <!-- Your App Logic -->
    <script src="assets/js/app.js?v=9"></script>

</body>
</html>
