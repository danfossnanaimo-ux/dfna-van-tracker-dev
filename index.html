<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DFNA Van Tracker</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #sessionInfo {
            height: 50px;
            line-height: 50px;
            background: #222;
            color: #fff;
            text-align: center;
            font-size: 16px;
            position: absolute;
            top: 0;
            width: 100%;
            z-index: 9999;
        }

        #map {
            position: absolute;
            top: 50px;   /* below the session bar */
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: calc(100% - 50px);
            background: #000;
        }
    </style>
</head>

<body>

    <div id="sessionInfo">Loading session…</div>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Your app logic -->
    <script src="assets/js/app.js?v=11"></script>

    <script>
        // Force Leaflet to recalc size once iframe becomes visible
        setTimeout(() => {
            if (window.map && window.map.invalidateSize) {
                window.map.invalidateSize();
            }
        }, 400);
    </script>

</body>
</html>
