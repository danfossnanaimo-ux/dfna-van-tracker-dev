<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Driver Login</title>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        #scanner {
            width: 100vw;
            height: 100vh;
        }
        #scanner > * {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body style="margin:0; padding:0;">

<div id="scanner"></div>

<script>
function showGreeting(firstName) {
    document.body.innerHTML = `
        <div style="
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            font-size:32px;
            text-align:center;
            font-weight:bold;
        ">
            Hello,<br>${firstName}
        </div>
    `;

    setTimeout(() => {
        window.location.href = "van-scan.html";
    }, 2000);
}

function startDriverScanner() {
    const scanner = new Html5Qrcode("scanner");

    scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        (decodedText) => {

            const parts = decodedText.split("|");
            const fullName = parts[1] || "";
            const firstName = fullName.split(" ")[0];

            localStorage.setItem("dfnaSession", JSON.stringify({
                user: { name: fullName }
            }));

            scanner.stop().then(() => {
                setTimeout(() => {
                    showGreeting(firstName);
                }, 200); // SAFARI FIX
            });
        }
    );
}

startDriverScanner();
</script>

</body>
</html>
