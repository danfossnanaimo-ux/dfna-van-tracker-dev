<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Driver Login</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body style="margin:0; padding:0;">

<div id="scanner" style="width:100%; height:100vh;"></div>

<script>
function showGreeting(firstName) {
    document.body.innerHTML = `
        <div style="
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            font-size:32px;
            text-align:center;
            font-weight:bold;
        ">
            Hello,<br>${firstName}
        </div>
    `;

    setTimeout(() => {
        window.location.href = "van-scan.html";
    }, 2000);
}

function startDriverScanner() {
    const scanner = new Html5Qrcode("scanner");

    scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        (decodedText) => {

            // EXAMPLE FORMAT: DRIVER|Kelly Johnson
            const parts = decodedText.split("|");
            const fullName = parts[1] || "";
            const firstName = fullName.split(" ")[0];

            // Save session
            localStorage.setItem("dfnaSession", JSON.stringify({
                user: { name: fullName }
            }));

            scanner.stop().then(() => {
                showGreeting(firstName);
            });
        },
        (err) => { /* ignore scan errors */ }
    );
}

startDriverScanner();
</script>

</body>
</html>
