<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Scan Van</title>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        #scanner {
            width: 100vw;
            height: 100vh;
        }
        #scanner > * {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body style="margin:0; padding:0;">

<div id="scanner"></div>

<script>
function showLoading(vanNumber) {
    localStorage.setItem("dfnaVan", vanNumber);

    window.location.href = "/dfna-van-tracker-dev/loading.html";
}

function startVanScanner() {
    const scanner = new Html5Qrcode("scanner");

    scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        decodedText => {
            const parts = decodedText.split("|");
            const vanNumber = parts[1];

            scanner.stop().then(() => {
                setTimeout(() => showLoading(vanNumber), 200);
            });
        }
    );
}

startVanScanner();
</script>

</body>
</html>
