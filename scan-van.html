<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scan Van</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: system-ui, sans-serif;
        color: white;
    }

    #container {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    #preview {
        width: 320px;
        height: 320px;
        background: #111;
        border-radius: 16px;
        object-fit: cover;
    }

    #caption {
        margin-top: 18px;
        font-size: 22px;
        font-weight: 500;
        text-align: center;
    }
</style>
</head>

<body>

<div id="container">
    <video id="preview" autoplay playsinline></video>
    <p id="caption">Scan Van QR Code</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.umd.min.js"></script>

<script>
    const video = document.getElementById("preview");
    let scanner;

    async function startScanner() {
        try {
            scanner = new QrScanner(video, result => handleScan(result.data), {
                preferredCamera: "environment"
            });
            await scanner.start();
        } catch (err) {
            fallbackToDefaultCamera();
        }
    }

    async function fallbackToDefaultCamera() {
        try {
            scanner = new QrScanner(video, result => handleScan(result.data), {
                preferredCamera: "auto"
            });
            await scanner.start();
        } catch (err) {
            console.error("Camera failed:", err);
        }
    }

    async function handleScan(text) {
        scanner.stop();

        const cleaned = text.replace(/\s+/g, " ").trim();
        const parts = cleaned.split("|").map(p => p.trim());

        const vanNumber = parts[1] || "Unknown";

        localStorage.setItem("dfnaVan", vanNumber);

        window.location.href = "/dfna-van-tracker-dev/loading.html";
    }

    window.onload = startScanner;
</script>

<script>
    async function handleScan(text) {
        scanner.stop();

        const cleaned = text.replace(/\s+/g, " ").trim();
        const parts = cleaned.split("|").map(p => p.trim());

        const vanNumber = parts[1] || "Unknown";

        alert("SCAN-VAN DEBUG:\nRaw: " + text + "\nCleaned: " + cleaned + "\nVan: " + vanNumber);

        console.log("SCAN-VAN DEBUG — Saving dfnaVan =", vanNumber);

        localStorage.setItem("dfnaVan", vanNumber);

        window.location.href = "/dfna-van-tracker-dev/loading.html";
    }
</script>

</body>
</html>
