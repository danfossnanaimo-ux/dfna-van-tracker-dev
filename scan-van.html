<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Scan Van QR Code</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: white;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
            text-align: center;
        }

        #camera {
            width: 90vw;
            max-width: 500px;
            aspect-ratio: 1;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        #camera video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Scanner box overlay */
        .scanner-box {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60%;
            height: 60%;
            transform: translate(-50%, -50%);
            border: 4px solid rgba(255,255,255,0.8);
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255,255,255,0.4);
            pointer-events: none;
        }

        h1 {
            margin-top: 20px;
            font-size: 28px;
            font-weight: 700;
        }
    </style>
</head>

<body>

    <div class="container">
        <div id="camera">
            <video id="video" autoplay playsinline></video>
            <div class="scanner-box"></div>
        </div>

        <h1>Scan Van QR Code</h1>
    </div>

    <script src="assets/js/qr-scanner.min.js"></script>
    <script src="assets/js/scan-van.js?v=3"></script>

</body>
</html>
