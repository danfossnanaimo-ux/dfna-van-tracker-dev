<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Select Van</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title {
            margin: 16px 0;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
        }

        #scanner {
            width: 100%;
            max-width: 480px;
            margin: 0 auto 16px auto;
        }
    </style>
</head>
<body>

<div class="title">Scan Van QR Code</div>
<div id="scanner"></div>

<script>
function cleanVIN(raw) {
    return raw
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, "")
        .trim();
}

function handleScan(decodedText) {
    const vin = cleanVIN(decodedText);

    console.log("RAW SCAN:", decodedText);
    console.log("CLEAN VIN:", vin);

    localStorage.setItem("dfnaVIN", vin);

    scanner.stop().then(() => {
        setTimeout(() => {
            window.location.href = "loading.html";
        }, 200);
    });
}

let scanner = null;

function startScanner() {
    scanner = new Html5Qrcode("scanner");

    scanner.start(
        { facingMode: "environment" },
        {
            fps: 10,
            qrbox: { width: 280, height: 280 }  // good-sized scan area
        },
        (decodedText) => handleScan(decodedText),
        (errorMessage) => {
            // ignore scan errors
        }
    );
}

startScanner();
</script>

</body>
</html>
