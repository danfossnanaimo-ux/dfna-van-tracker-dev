<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Select Van</title>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        /* Fullscreen scanner container */
        #scanner {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Force html5-qrcode internal elements to fill the screen */
        #scanner > * {
            width: 100% !important;
            height: 100% !important;
        }

        /* Title text */
        .title {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            z-index: 10;
        }
    </style>
</head>

<body>

<div class="title">Scan Van QR Code</div>
<div id="scanner"></div>

<script>
function cleanVIN(raw) {
    return raw
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, "")   // remove EVERYTHING except VIN-safe chars
        .trim();
}

function handleScan(decodedText) {
    const vin = cleanVIN(decodedText);

    console.log("RAW SCAN:", decodedText);
    console.log("CLEAN VIN:", vin);

    // Save cleaned VIN
    localStorage.setItem("dfnaVIN", vin);

    // Stop scanner before redirect
    scanner.stop().then(() => {
        setTimeout(() => {
            window.location.href = "loading.html";
        }, 200);
    });
}

function startScanner() {
    scanner = new Html5Qrcode("scanner");

    scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        (decodedText) => handleScan(decodedText),
        (err) => { /* ignore scan errors */ }
    );
}

let scanner = null;
startScanner();
</script>

</body>
</html>
