<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DFNA Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: system-ui, sans-serif;
        color: white;
    }

    #container {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    #preview {
        width: 320px;
        height: 320px;
        background: #111;
        border-radius: 16px;
        object-fit: cover;
    }

    #caption {
        margin-top: 18px;
        font-size: 22px;
        font-weight: 500;
        text-align: center;
    }
</style>
</head>

<body>

<div id="container">
    <video id="preview" autoplay playsinline></video>
    <p id="caption">Scan ID Card to Login</p>
</div>

<!-- FIXED, STABLE QR-SCANNER VERSION -->
<script src="https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.umd.min.js"></script>

<script>
    const video = document.getElementById("preview");
    let scanner;

    async function startScanner() {
        console.log("Starting scanner...");

        try {
            scanner = new QrScanner(video, result => handleScan(result.data), {
                preferredCamera: "environment"
            });

            await scanner.start();
            console.log("Camera started");

        } catch (err) {
            console.warn("Environment camera failed, trying default...", err);
            fallbackToDefaultCamera();
        }
    }

    async function fallbackToDefaultCamera() {
        try {
            scanner = new QrScanner(video, result => handleScan(result.data), {
                preferredCamera: "auto"
            });

            await scanner.start();
            console.log("Fallback camera started");

        } catch (err) {
            console.error("Camera failed:", err);
        }
    }

    function handleScan(text) {
        alert("Scanned: [" + text + "]");
        scanner.stop();

        const parts = text.split("/");
        if (parts.length < 3) {
            alert("Invalid QR format");
            startScanner();
            return;
        }

        const user = {
            name: parts[0].trim(),
            division: parts[1].trim(),
            employeeId: parts[2].trim()
        };

        localStorage.setItem("dfnaUser", JSON.stringify(user));

        window.location.href = "index.html";
    }

    window.onload = startScanner;
</script>

</body>
</html>
