<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loading Van</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: system-ui, sans-serif;
        color: white;
        font-size: 40px;
        font-weight: 700;
        text-align: center;
    }
</style>
</head>

<body>

<div id="msg">Loading…</div>

<script>
let van = localStorage.getItem("dfnaVan");

if (!van) {
    document.getElementById("msg").innerHTML = "No van selected";
    throw new Error("Missing van number");
}

document.getElementById("msg").innerHTML = `Locating<br>Van ${van}…`;

const iframe = document.createElement("iframe");
iframe.src = "/dfna-van-tracker-dev/index.html";
iframe.style.display = "none";
iframe.style.width = "100vw";
iframe.style.height = "100vh";
iframe.style.border = "none";
document.body.appendChild(iframe);

window.addEventListener("message", (event) => {
    if (event.data === "MAP_READY") {
        document.body.innerHTML = "";
        iframe.style.display = "block";
    }
});
</script>

</body>
</html>
