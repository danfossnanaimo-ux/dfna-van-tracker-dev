<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/dfna-van-tracker-dev/manifest.json">
<meta name="theme-color" content="#000000">

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/dfna-van-tracker-dev/service-worker.js");
}
</script><title>Loading Van</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: system-ui, sans-serif;
        color: white;
        text-align: center;
    }
</style>
</head>

<body>

<div id="msg"></div>

<script>
// Show initial message while waiting for map to load
document.getElementById("msg").innerHTML = `
    <div style="
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        width:100vw;
        font-size:40px;
        font-weight:700;
    ">
        Locating…
    </div>
`;

// Load the map in a hidden iframe
const iframe = document.createElement("iframe");
iframe.src = "./index.html";
iframe.style.display = "none";
iframe.style.width = "100vw";
iframe.style.height = "100vh";
iframe.style.border = "none";
document.body.appendChild(iframe);

// Wait for app.js to send MAP_READY with vanNumber
window.addEventListener("message", (event) => {
    if (event.data?.type === "MAP_READY") {
        const van = event.data.vanNumber || "Unknown";

        // Update loading message to show van number
        document.getElementById("msg").innerHTML = `
            <div style="
                display:flex;
                justify-content:center;
                align-items:center;
                height:100vh;
                width:100vw;
                font-size:40px;
                font-weight:700;
            ">
                Locating…<br>Van ${van}
            </div>
        `;

        // After a short delay, reveal the map
setTimeout(() => {
    document.getElementById("msg").remove();   // remove loading message ONLY
    iframe.style.display = "block";            // show the map iframe
}, 600);

    }
});
</script>

</body>
</html>
