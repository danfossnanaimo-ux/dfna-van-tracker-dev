<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DFNA Van Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/dfna-van-tracker-dev/manifest.json">
<meta name="theme-color" content="#000000">

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/dfna-van-tracker-dev/service-worker.js");
}
</script>

<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: #000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: system-ui, sans-serif;
        color: white;
        text-align: center;
    }

    /* Logo 25% larger */
    #logo {
        width: 325px; /* previously 260px */
        max-width: 85%;
        margin-bottom: 50px;
    }

    /* Button 25% smaller + pulsing animation */
    #startBtn {
        padding: 16px 30px; /* reduced from 22px 40px */
        font-size: 20px;    /* reduced from 24px */
        font-weight: 700;
        border-radius: 14px;
        border: none;
        background: white;
        color: black;
        animation: pulse 1.6s infinite ease-in-out;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.08); }
        100% { transform: scale(1); }
    }
</style>
</head>

<body>

<img id="logo" src="assets/img/danfoss-logo.png" alt="Danfoss Logo">

<button id="startBtn">Locate Van</button>

<script>
document.getElementById("startBtn").onclick = () => {
    window.location.href = "scan-driver.html";
};
</script>

</body>
</html>
