<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Scan Driver</title>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        #scanner {
            width: 100vw;
            height: 100vh;
        }
        #scanner > * {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body style="margin:0; padding:0;">

<div id="scanner"></div>

<script>
function handleDriverScan(text) {
    scanner.stop();

    const cleaned = text.replace(/\s+/g, " ").trim();
    const parts = cleaned.split("|");

    const fullName = parts[1] || "";
    localStorage.setItem("dfnaSession", JSON.stringify({
        user: { name: fullName }
    }));

    window.location.href = "/dfna-van-tracker-dev/greeting.html";
}

const scanner = new Html5Qrcode("scanner");
scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    handleDriverScan
);
</script>

</body>
</html>
