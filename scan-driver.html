<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DFNA Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: system-ui, sans-serif;
        color: white;
    }

    #container {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    #preview {
        width: 320px;
        height: 320px;
        background: #111;
        border-radius: 16px;
        object-fit: cover;
    }

    #caption {
        margin-top: 18px;
        font-size: 22px;
        font-weight: 500;
        text-align: center;
    }
</style>
</head>

<body>

<div id="container">
    <video id="preview" autoplay playsinline></video>
    <p id="caption">Scan Driver QR Code</p>
</div>

<div id="errorOverlay" style="
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0,0,0,0.75);
    display: none;
    justify-content: center;
    align-items: center;
    font-size: 32px;
    font-weight: 700;
    color: white;
    z-index: 9999;
"></div>

<script src="https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.umd.min.js"></script>

<script>
    const video = document.getElementById("preview");
    const overlay = document.getElementById("errorOverlay");
    let scanner;

    async function startScanner() {
        try {
            scanner = new QrScanner(video, result => handleScan(result.data), {
                preferredCamera: "environment"
            });
            await scanner.start();
        } catch (err) {
            console.error("Camera failed:", err);
        }
    }

    function showError(msg) {
        overlay.textContent = msg;
        overlay.style.display = "flex";

        setTimeout(() => {
            overlay.style.display = "none";
            startScanner();
        }, 2000);
    }

    function handleScan(text) {
        try {
            processScan(text);
        } catch (err) {
            console.error("Driver scan error:", err);
            showError("Invalid User");
        }
    }

    function processScan(text) {
        if (!scanner) throw new Error("Scanner not initialized");
        scanner.stop();

        const cleaned = text.replace(/\s+/g, " ").trim();
        const parts = cleaned.split("/").map(p => p.trim());

        if (parts.length < 3) throw new Error("Invalid format");

        const user = {
            name: parts[0],
            division: parts[1],
            employeeId: parts[2]
        };

        localStorage.setItem("dfnaUser", JSON.stringify(user));
        window.location.href = "/dfna-van-tracker-dev/greeting.html";
    }

    window.onload = startScanner;
</script>

</body>
</html>
