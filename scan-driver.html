<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Driver Login</title>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        #scanner {
            width: 100vw;
            height: 100vh;
        }
        #scanner > * {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body style="margin:0; padding:0;">

<div id="scanner"></div>

<script>
function startDriverScanner() {
    const scanner = new Html5Qrcode("scanner");

    scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        (decodedText) => {

            const parts = decodedText.split("|");
            const fullName = parts[1] || "";

            // Save session
            localStorage.setItem("dfnaSession", JSON.stringify({
                user: { name: fullName }
            }));

            scanner.stop().then(() => {
                // SAFARI FIX
                setTimeout(() => {
                    window.location.href = "/dfna-van-tracker-dev/greeting.html";
                }, 200);
            });
        }
    );
}

startDriverScanner();
</script>

</body>
</html>
