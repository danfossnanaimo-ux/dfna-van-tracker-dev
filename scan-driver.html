<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Scan Driver</title>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        #scanner {
            width: 100vw;
            height: 100vh;
        }

        #scanner > * {
            width: 100% !important;
            height: 100% !important;
        }

        /* Desktop fix: un-mirror webcam */
        @media (min-width: 768px) {
            video {
                transform: scaleX(-1) !important;
            }
        }
    </style>
</head>

<body>

<div id="scanner"></div>

<script>
function handleDriverScan(text) {
    scanner.stop();

    const cleaned = text.replace(/\s+/g, " ").trim();
    const parts = cleaned.split("|");

    const fullName = parts[1] || "";
    localStorage.setItem("driver", fullName);

    window.location.href = "greeting.html";
}

const scanner = new Html5Qrcode("scanner");

scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    handleDriverScan
);
</script>

</body>
</html>
